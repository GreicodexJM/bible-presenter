<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .verse-background {
        fill: rgba(0, 0, 0, 0.9);
        stroke: #ffffff;
        stroke-width: 1;
        rx: 5;
        vector-effect: non-scaling-stroke;
      }
      .verse-text {
        font-family: Arial, sans-serif;
        font-size: 8px;
        fill: #ffffff;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .verse-reference {
        font-family: Arial, sans-serif;
        font-size: 6px;
        font-weight: bold;
        fill: #ffffff;
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </defs>
  <rect x="2" y="2" width="96" height="96" class="verse-background"/>
  <text x="50" y="20" class="verse-reference">{{reference}}</text>
  <text x="50" y="60" class="verse-text">{{text}}</text>
</svg>
