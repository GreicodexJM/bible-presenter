<svg width="{{width}}" height="{{height}}" viewBox="0 0 {{width}} {{height}}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .verse-background {
        fill: rgba(15, 25, 45, 0.85);
        stroke: #add8e6;
        stroke-width: 2;
        rx: 18;
        filter: drop-shadow(0 6px 16px rgba(173, 216, 230, 0.5));
      }
      .verse-text {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 26px;
        fill: #f0f8ff;
        text-anchor: middle;
        dominant-baseline: middle;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        font-weight: 300;
        line-height: 1.4;
      }
      .verse-reference {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 22px;
        font-weight: 500;
        fill: #b0e0e6;
        text-anchor: middle;
        dominant-baseline: middle;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      }
      .flow-patterns {
        stroke: rgba(173, 216, 230, 0.2);
        stroke-width: 1;
        fill: none;
      }
    </style>
  </defs>

  <!-- Atmospheric flow patterns -->
  <path d="M 25 80 Q 100 75 175 80 Q 250 85 325 80 Q 400 75 475 80" class="flow-patterns"/>
  <path d="M 25 120 Q 120 115 215 120 Q 310 125 405 120 Q 500 115 575 120" class="flow-patterns"/>
  <path d="M 25 160 Q 80 155 135 160 Q 190 165 245 160 Q 300 155 355 160" class="flow-patterns"/>

  <!-- Main background -->
  <rect x="20" y="20" width="{{innerWidth}}" height="{{innerHeight}}" class="verse-background"/>

  <!-- Reference -->
  <text x="{{centerX}}" y="{{referenceY}}" class="verse-reference">{{reference}}</text>

  <!-- Verse Text -->
  <text x="{{centerX}}" y="{{textY}}" class="verse-text">{{text}}</text>
</svg>
