<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .verse-background {
        fill: rgba(15, 25, 45, 0.85);
        stroke: #add8e6;
        stroke-width: 2;
        rx: 5;
        filter: drop-shadow(0 6px 16px rgba(173, 216, 230, 0.5));
        vector-effect: non-scaling-stroke;
      }
      .verse-text {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 8px;
        fill: #f0f8ff;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .verse-reference {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 6px;
        font-weight: 500;
        fill: #b0e0e6;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .flow-patterns {
        stroke: rgba(173, 216, 230, 0.2);
        stroke-width: 1;
        fill: none;
        vector-effect: non-scaling-stroke;
      }
    </style>
  </defs>
  <path d="M 3 40 Q 12 37 22 40 Q 31 43 40 40 Q 50 37 60 40" class="flow-patterns"/>
  <path d="M 3 60 Q 15 57 27 60 Q 38 63 50 60 Q 62 57 72 60" class="flow-patterns"/>
  <rect x="2" y="2" width="96" height="96" rx="5" ry="5" class="verse-background"/>
  <text x="50" y="20" class="verse-reference">{{reference}}</text>
  <text x="50" y="60" class="verse-text">{{text}}</text>
</svg>
