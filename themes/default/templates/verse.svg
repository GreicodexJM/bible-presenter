<svg width="{{width}}" height="{{height}}" viewBox="0 0 {{width}} {{height}}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .verse-background {
        fill: rgba(0, 0, 0, 0.9);
        stroke: #ffffff;
        stroke-width: 1;
        rx: 15;
      }
      .verse-text {
        font-family: Arial, sans-serif;
        font-size: 28px;
        fill: #ffffff;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .verse-reference {
        font-family: Arial, sans-serif;
        font-size: 24px;
        font-weight: bold;
        fill: #ffffff;
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="20" y="20" width="{{innerWidth}}" height="{{innerHeight}}" class="verse-background"/>

  <!-- Reference -->
  <text x="{{centerX}}" y="{{referenceY}}" class="verse-reference">{{reference}}</text>

  <!-- Verse Text -->
  <text x="{{centerX}}" y="{{textY}}" class="verse-text">{{text}}</text>
</svg>
