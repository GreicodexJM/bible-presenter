  </defs>
  <path d="M 10 90 Q 20 70 30 90 T 50 90" class="wave-lines"/>
  <path d="M 60 90 Q 70 70 80 90 T 100 90" class="wave-lines"/>
  <rect x="2" y="2" width="96" height="96" rx="5" ry="5" class="input-background"/>
</svg>
