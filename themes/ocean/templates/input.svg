<svg width="{{width}}" height="{{height}}" viewBox="0 0 {{width}} {{height}}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .input-background {
        fill: rgba(0, 40, 80, 0.7);
        stroke: #4fc3f7;
        stroke-width: 2;
        rx: 15;
        filter: drop-shadow(0 4px 8px rgba(79, 195, 247, 0.3));
      }
      .input-text {
        font-family: 'Segoe UI', sans-serif;
        font-size: 24px;
        fill: #e1f5fe;
        text-anchor: middle;
        dominant-baseline: middle;
        font-weight: 300;
        letter-spacing: 1px;
      }
      .wave-lines {
        stroke: rgba(255, 255, 255, 0.2);
        stroke-width: 1.5;
        fill: none;
      }
    </style>
  </defs>

  <!-- Decorative wave lines -->
  <path d="M 20 60 Q 60 50 100 60 T 180 60" class="wave-lines"/>
  <path d="M 20 68 Q 60 58 100 68 T 180 68" class="wave-lines"/>

  <!-- Main background -->
  <rect x="10" y="10" width="{{innerWidth}}" height="{{innerHeight}}" class="input-background"/>

  <!-- Text -->
  <text x="{{centerX}}" y="{{centerY}}" class="input-text">{{text}}</text>
</svg>
