<svg width="{{width}}" height="{{height}}" viewBox="0 0 {{width}} {{height}}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .verse-background {
        fill: rgba(0, 40, 80, 0.85);
        stroke: #81d4fa;
        stroke-width: 2;
        rx: 20;
        filter: drop-shadow(0 6px 12px rgba(129, 212, 250, 0.4));
      }
      .verse-text {
        font-family: 'Segoe UI', sans-serif;
        font-size: 26px;
        fill: #e1f5fe;
        text-anchor: middle;
        dominant-baseline: middle;
        font-weight: 300;
        line-height: 1.4;
      }
      .verse-reference {
        font-family: 'Segoe UI', sans-serif;
        font-size: 22px;
        font-weight: 500;
        fill: #b3e5fc;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .bubble-decoration {
        fill: rgba(225, 245, 254, 0.2);
        stroke: none;
      }
    </style>
  </defs>

  <!-- Decorative bubbles -->
  <circle cx="40" cy="180" r="8" class="bubble-decoration"/>
  <circle cx="60" cy="160" r="5" class="bubble-decoration"/>
  <circle cx="950" cy="40" r="10" class="bubble-decoration"/>
  <circle cx="930" cy="70" r="6" class="bubble-decoration"/>

  <!-- Main background -->
  <rect x="20" y="20" width="{{innerWidth}}" height="{{innerHeight}}" class="verse-background"/>

  <!-- Reference -->
  <text x="{{centerX}}" y="{{referenceY}}" class="verse-reference">{{reference}}</text>

  <!-- Verse Text -->
  <text x="{{centerX}}" y="{{textY}}" class="verse-text">{{text}}</text>
</svg>
