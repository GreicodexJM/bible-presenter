<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .verse-background {
        fill: rgba(0, 40, 80, 0.85);
        stroke: #81d4fa;
        stroke-width: 2;
        filter: drop-shadow(0 6px 12px rgba(129, 212, 250, 0.4));
        vector-effect: non-scaling-stroke;
      }
      .verse-text {
        font-family: 'Segoe UI', sans-serif;
        font-size: 8px;
        fill: #e1f5fe;
        text-anchor: middle;
        dominant-baseline: middle;
        font-weight: 300;
        line-height: 1.4;
      }
      .verse-reference {
        font-family: 'Segoe UI', sans-serif;
        font-size: 6px;
        font-weight: 500;
        fill: #b3e5fc;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .bubble-decoration {
        fill: rgba(225, 245, 254, 0.2);
        stroke: none;
        vector-effect: non-scaling-stroke;
      }
    </style>
  </defs>
  <circle cx="10" cy="90" r="1.5" class="bubble-decoration"/>
  <circle cx="15" cy="80" r="1" class="bubble-decoration"/>
  <circle cx="90" cy="10" r="2" class="bubble-decoration"/>
  <circle cx="85" cy="20" r="1.2" class="bubble-decoration"/>
  <rect x="2" y="2" width="96" height="96" rx="5" ry="5" class="verse-background"/>
  <text x="50" y="20" class="verse-reference">{{reference}}</text>
  <text x="50" y="60" class="verse-text">{{text}}</text>
</svg>
