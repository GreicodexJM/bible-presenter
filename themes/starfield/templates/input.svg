<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .input-background {
        fill: rgba(5, 15, 35, 0.9);
        stroke: #64b5f6;
        stroke-width: 2;
        rx: 8;
        filter: drop-shadow(0 0 20px rgba(100, 181, 246, 0.5));
