  <circle cx="8" cy="25" r="2" class="cosmic-particles" vector-effect="non-scaling-stroke"/>
  <circle cx="25" cy="18" r="1.5" class="cosmic-particles" vector-effect="non-scaling-stroke"/>
  <circle cx="41" cy="31" r="1" class="cosmic-particles" vector-effect="non-scaling-stroke"/>
  <circle cx="58" cy="22" r="2.5" class="cosmic-particles" vector-effect="non-scaling-stroke"/>
  <circle cx="75" cy="27" r="1.8" class="cosmic-particles" vector-effect="non-scaling-stroke"/>
  <circle cx="91" cy="15" r="1.2" class="cosmic-particles" vector-effect="non-scaling-stroke"/>
  <rect x="2" y="2" width="96" height="96" rx="5" ry="5" class="input-background"/>
</svg>
