<svg width="{{width}}" height="{{height}}" viewBox="0 0 {{width}} {{height}}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .verse-background {
        fill: rgba(8, 20, 40, 0.9);
        stroke: #81c784;
        stroke-width: 2;
        rx: 12;
        filter: drop-shadow(0 0 25px rgba(129, 199, 132, 0.6));
      }
      .verse-text {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 24px;
        fill: #f1f8e9;
        text-anchor: middle;
        dominant-baseline: middle;
        text-shadow: 0 0 15px rgba(129, 199, 132, 0.9);
        font-weight: 300;
        line-height: 1.5;
      }
      .verse-reference {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 20px;
        font-weight: 500;
        fill: #a5d6a7;
        text-anchor: middle;
        dominant-baseline: middle;
        text-shadow: 0 0 8px rgba(129, 199, 132, 0.7);
      }
      .stellar-patterns {
        stroke: rgba(129, 199, 132, 0.3);
        stroke-width: 1;
        fill: none;
      }
    </style>
  </defs>

  <!-- Stellar constellation patterns -->
  <path d="M 30 70 Q 80 65 130 70 Q 180 75 230 70" class="stellar-patterns"/>
  <path d="M 30 110 Q 90 105 150 110 Q 210 115 270 110 Q 330 105 390 110" class="stellar-patterns"/>
  <path d="M 30 150 Q 100 145 170 150 Q 240 155 310 150 Q 380 145 450 150" class="stellar-patterns"/>
  <path d="M 30 190 Q 120 185 210 190 Q 300 195 390 190" class="stellar-patterns"/>

  <!-- Main background -->
  <rect x="15" y="15" width="{{innerWidth}}" height="{{innerHeight}}" class="verse-background"/>

  <!-- Reference -->
  <text x="{{centerX}}" y="{{referenceY}}" class="verse-reference">{{reference}}</text>

  <!-- Verse Text -->
  <text x="{{centerX}}" y="{{textY}}" class="verse-text">{{text}}</text>
</svg>
