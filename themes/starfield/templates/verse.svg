<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .verse-background {
        fill: rgba(8, 20, 40, 0.9);
        stroke: #81c784;
        stroke-width: 2;
        rx: 5;
        filter: drop-shadow(0 0 25px rgba(129, 199, 132, 0.6));
        vector-effect: non-scaling-stroke;
      }
      .verse-text {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 8px;
        fill: #f1f8e9;
        text-anchor: middle;
        dominant-baseline: middle;
        text-shadow: 0 0 15px rgba(129, 199, 132, 0.9);
        line-height: 1.5;
      }
      .verse-reference {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 6px;
        font-weight: 500;
        fill: #a5d6a7;
        text-anchor: middle;
        dominant-baseline: middle;
        text-shadow: 0 0 8px rgba(129, 199, 132, 0.7);
      }
      .stellar-patterns {
        stroke: rgba(129, 199, 132, 0.3);
        stroke-width: 1;
        fill: none;
        vector-effect: non-scaling-stroke;
      }
    </style>
  </defs>
  <path d="M 4 35 Q 10 32 16 35 Q 22 38 28 35" class="stellar-patterns"/>
  <path d="M 4 55 Q 11 52 18 55 Q 26 58 33 55 Q 41 52 48 55" class="stellar-patterns"/>
  <path d="M 4 75 Q 12 72 21 75 Q 30 78 38 75 Q 47 72 56 75" class="stellar-patterns"/>
  <path d="M 4 95 Q 15 92 26 95 Q 37 98 48 95" class="stellar-patterns"/>
  <rect x="2" y="2" width="96" height="96" rx="5" ry="5" class="verse-background"/>
  <text x="50" y="20" class="verse-reference">{{reference}}</text>
  <text x="50" y="60" class="verse-text">{{text}}</text>
</svg>
