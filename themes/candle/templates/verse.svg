<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .verse-background {
        fill: rgba(40, 30, 20, 0.85);
        stroke: #ffb74d;
        stroke-width: 2;
        filter: drop-shadow(0 0 15px rgba(255, 183, 77, 0.4));
        vector-effect: non-scaling-stroke;
      }
      .verse-text {
        font-family: 'Segoe UI', sans-serif;
        font-size: 8px; /* Relative font size */
        fill: #fff8e1;
        text-anchor: middle;
        dominant-baseline: middle;
        font-weight: 300;
        line-height: 1.4;
      }
      .verse-reference {
        font-family: 'Segoe UI', sans-serif;
        font-size: 6px;
        font-weight: 500;
        fill: #ffe0b2;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .spark-decoration {
        fill: rgba(255, 224, 178, 0.4);
        stroke: none;
        filter: blur(0.5px);
        vector-effect: non-scaling-stroke;
      }
    </style>
  </defs>

  <!-- Decorative sparks -->
  <circle cx="5" cy="90" r="1" class="spark-decoration"/>
  <circle cx="8" cy="80" r="0.5" class="spark-decoration"/>
  <circle cx="95" cy="5" r="1" class="spark-decoration"/>
  <circle cx="92" cy="15" r="0.5" class="spark-decoration"/>

  <!-- Main background -->
  <rect x="2" y="2" width="96" height="96" rx="5" ry="5" class="verse-background"/>

  <!-- Reference -->
  <text x="50" y="20" class="verse-reference">{{reference}}</text>

  <!-- Verse Text -->
  <text x="50" y="60" class="verse-text">{{text}}</text>
</svg>
