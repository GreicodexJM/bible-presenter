<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .input-background {
        fill: rgba(40, 30, 20, 0.7);
        stroke: #ffecb3;
        stroke-width: 2;
        filter: drop-shadow(0 0 5px rgba(255, 236, 179, 0.3));
        vector-effect: non-scaling-stroke;
      }
      .wax-lines {
        stroke: rgba(255, 248, 225, 0.2);
        stroke-width: 1.5;
        fill: none;
        vector-effect: non-scaling-stroke;
      }
    </style>
  </defs>

  <!-- Decorative wax lines -->
  <path d="M 10 90 Q 20 70 30 90 T 50 90" class="wax-lines"/>
  <path d="M 60 90 Q 70 70 80 90 T 90 90" class="wax-lines"/>

  <!-- Main background -->
  <rect x="1" y="1" width="98" height="98" rx="5" ry="5" class="input-background"/>
</svg>
