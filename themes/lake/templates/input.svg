<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .input-background {
        fill: rgba(0, 0, 0, 0.7);
        stroke: #4a90e2;
        stroke-width: 2;
        rx: 5;
        filter: drop-shadow(0 4px 8px rgba(74, 144, 226, 0.3));
        vector-effect: non-scaling-stroke;
      }
      .water-reflection {
        fill: rgba(74, 144, 226, 0.2);
        stroke: #4a90e2;
        stroke-width: 1;
        rx: 5;
        vector-effect: non-scaling-stroke;
      }
    </style>
  </defs>
  <rect x="2" y="65" width="96" height="25" class="water-reflection" opacity="0.6"/>
  <rect x="2" y="2" width="96" height="96" rx="5" ry="5" class="input-background"/>
</svg>
