<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .verse-background {
        fill: rgba(60, 0, 0, 0.85);
        stroke: #ff9800;
        stroke-width: 2;
        filter: drop-shadow(0 0 15px rgba(255, 152, 0, 0.5));
        vector-effect: non-scaling-stroke;
      }
      .verse-text {
        font-family: 'Segoe UI', sans-serif;
        font-size: 8px;
        fill: #fff3e0;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .verse-reference {
        font-family: 'Segoe UI', sans-serif;
        font-size: 6px;
        font-weight: 500;
        fill: #ffcc80;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .ember-decoration {
        fill: rgba(255, 167, 38, 0.4);
        stroke: none;
        filter: blur(1px);
        vector-effect: non-scaling-stroke;
      }
    </style>
  </defs>
  <circle cx="5" cy="90" r="1" class="ember-decoration"/>
  <circle cx="8" cy="80" r="0.8" class="ember-decoration"/>
  <circle cx="95" cy="5" r="1" class="ember-decoration"/>
  <rect x="2" y="2" width="96" height="96" rx="5" ry="5" class="verse-background"/>
  <text x="50" y="20" class="verse-reference">{{reference}}</text>
  <text x="50" y="60" class="verse-text">{{text}}</text>
</svg>
